name: Scrap Hyperplanning

# Titre des runs : l'origine du déclenchement (qstash, schedule, manual…), pour les distinguer dans la liste.
run-name: Scrap Hyperplanning (${{ inputs.source || github.event_name }})

on:
  # Déclencheur principal : un planificateur externe (QStash) appelle l'API GitHub (workflow_dispatch) toutes les
  # 15 minutes. Le cron de GitHub ci-dessous ne suffit pas : il saute presque tous ses déclenchements (constaté :
  # 1 run pour 13 créneaux en une journée). Il reste en renfort.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation : rien n’est écrit dans Redis'
        type: boolean
        default: false
      force:
        description: 'Scrap manuel : ignore les gardes d’heure et de fraîcheur'
        type: boolean
        default: false
      source:
        description: 'Origine du déclenchement, informatif (ex. qstash)'
        type: string
        default: ''
  schedule:
    # Toutes les 15 minutes, de 5h à 16h UTC : couvre 7h–17h Europe/Brussels en été (UTC+2) comme en hiver (UTC+1).
    # Les minutes évitent l'heure pile, très chargée chez GitHub.
    - cron: '12,27,42,57 5-16 * * *'

permissions:
  contents: read

# Jamais deux scraps en même temps : on ne double pas les requêtes vers Hyperplanning.
concurrency:
  group: scrap
  cancel-in-progress: false

jobs:
  scrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Action épinglée par son commit (v7.0.1) : un tag peut être déplacé, pas un commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scrap vers Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          # Les gardes d'heure et de fraîcheur s'appliquent à tout déclenchement, cron ou QStash : sans elles, chacun
          # scraperait. Seuls un lancement forcé ou une simulation les ignorent. Par défaut elles sont actives, donc
          # une erreur de réglage du planificateur fait ignorer des runs au lieu de charger Hyperplanning.
          if [ "$FORCE" != true ] && [ "$DRY_RUN" != true ]; then args+=(--only-in-hours --skip-if-fresh); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scraper/scrap-to-redis.mjs "${args[@]}"
