name: Scrap Hyperplanning

on:
  schedule:
    # Toutes les 15 minutes, de 5h à 16h UTC : couvre 7h–17h Europe/Brussels en été (UTC+2) comme en hiver
    # (UTC+1). Le script écarte les heures hors plage (--only-in-hours).
    # GitHub saute ou retarde des exécutions planifiées (constaté : 1 sur 6 en une matinée). On se déclenche donc
    # 4 fois par heure, et --skip-if-fresh ne scrape que si le dernier scrap a plus de 50 minutes : environ un
    # scrap par heure, sans requête de plus vers Hyperplanning. Les minutes évitent l'heure pile, très chargée.
    - cron: '12,27,42,57 5-16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation : rien n’est écrit dans Redis'
        type: boolean
        default: false

permissions:
  contents: read

# Jamais deux scraps en même temps : on ne double pas les requêtes vers Hyperplanning.
concurrency:
  group: scrap
  cancel-in-progress: false

jobs:
  scrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Action épinglée par son commit (v7.0.1) : un tag peut être déplacé, pas un commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scrap vers Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$EVENT" = schedule ]; then args+=(--only-in-hours --skip-if-fresh); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scraper/scrap-to-redis.mjs "${args[@]}"
